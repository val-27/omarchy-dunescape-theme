mode = "dark"

# Foundation & Accents
accent     = "#19a7a6" # Vibrant title teal/cyan
cursor     = "#1fc8db" # Glowing Paul Atreides spice-blue eye highlight
selection  = "#3f1c13" # Deep desert rust shadow
muted      = "#4a2820" # Desert nightstone (comments, inactive items)

# Window Borders & Halos
border                 = "#e07b22" # Radiant amber-orange sun halo rim
hyprland_active_border = "#e07b22" # Active window border in Hyprland & Shell

# Surfaces & Backgrounds
background         = "#140a08" # Deep shadowed obsidian-brown from cloak base
dark_background    = "#0e0705" # Deeper brown for sidebars
darker_background  = "#080403" # Deepest shadow
lighter_background = "#241310" # Card/popup surface

# Typography & Foregrounds
foreground         = "#f5d496" # Pale sand text color from author typography
dark_foreground    = "#8c7d6e" # Subdued text
light_foreground   = "#fae8c6" # Bright text
bright_foreground  = "#fae8c6" # Sun-bleached desert crest highlight

# Normal Colors (ANSI 1–7)
